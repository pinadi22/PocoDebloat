name: Release APK

# Berjalan saat ada tag versi, misalnya v1.0.5
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Siapkan file APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "PocoDebloat-${GITHUB_REF_NAME}.apk"

      - name: Buat Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "PocoDebloat-${GITHUB_REF_NAME}.apk" \
            --title "Poco Debloat ${GITHUB_REF_NAME}" \
            --generate-notes
